name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          mkdir -p "$HOME/.xlcore/dalamud/Hooks/dev"
          curl -sSfL -o "$RUNNER_TEMP/dalamud.zip" https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -q -o "$RUNNER_TEMP/dalamud.zip" -d "$HOME/.xlcore/dalamud/Hooks/dev"

      - name: Build
        run: dotnet build PartyIconsEvolved.sln -c Release

      - name: Test
        run: dotnet test PartyIconsEvolved.Tests -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: PartyIconsEvolved
          path: PartyIconsEvolved/bin/x64/Release/PartyIconsEvolved/latest.zip
          if-no-files-found: error
