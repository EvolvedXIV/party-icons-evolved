name: Release

# Run this by hand (Actions > Release > Run workflow) after bumping <Version> in PartyIconsEvolved.csproj.
# It publishes a GitHub release with the plugin zip here, then updates this plugin's entry in repo.json in the
# EvolvedXIV/releases repository, which is what makes the new version show up in game for everyone who added
# https://raw.githubusercontent.com/EvolvedXIV/releases/main/repo.json as a custom repository.
#
# Requires a repository secret RELEASES_TOKEN: a fine-grained personal access token (or GitHub App token) with
# "Contents: Read and write" on EvolvedXIV/releases. The built-in GITHUB_TOKEN can only write to this repository.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASES_REPO: EvolvedXIV/releases
  PLUGIN_DIR: PartyIconsEvolved/bin/x64/Release/PartyIconsEvolved

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check for the releases token
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Secret RELEASES_TOKEN is not set. See the comment at the top of release.yml."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Checked out before anything is published, so a bad token fails the run before a release exists.
      - name: Check out the releases repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          path: releases-repo

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          mkdir -p "$HOME/.xlcore/dalamud/Hooks/dev"
          curl -sSfL -o "$RUNNER_TEMP/dalamud.zip" https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -q -o "$RUNNER_TEMP/dalamud.zip" -d "$HOME/.xlcore/dalamud/Hooks/dev"

      - name: Build
        run: dotnet build PartyIconsEvolved.sln -c Release

      - name: Test
        run: dotnet test PartyIconsEvolved.Tests -c Release

      - name: Read version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('$PLUGIN_DIR/PartyIconsEvolved.json', encoding='utf-8-sig'))['AssemblyVersion'])")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::Release v$version already exists. Bump <Version> in PartyIconsEvolved.csproj first."
            exit 1
          fi

      - name: Publish release
        run: |
          cp "$PLUGIN_DIR/latest.zip" PartyIconsEvolved.zip
          gh release create "${{ steps.version.outputs.tag }}" PartyIconsEvolved.zip \
            --title "${{ steps.version.outputs.tag }}" --generate-notes --target "$GITHUB_SHA"

      - name: Update repo.json in the releases repository
        working-directory: releases-repo
        run: |
          python3 ../scripts/make_repo_json.py "../$PLUGIN_DIR/PartyIconsEvolved.json" repo.json
          if git diff --quiet -- repo.json; then
            echo "repo.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "PartyIconsEvolved ${{ steps.version.outputs.tag }}" -- repo.json
          git push origin HEAD
